<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | Balaji Coaching Center</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">

<i class="fa-solid fa-graduation-cap"></i>

<h2>Balaji</h2>

</div>

<ul>

<li>

<a href="dashboard.html">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

</li>

<li>

<a href="students.html">

<i class="fa-solid fa-user-graduate"></i>

Students

</a>

</li>

<li class="active">

<a href="settings.html">

<i class="fa-solid fa-gear"></i>

Settings

</a>

</li>

<li>

<a href="login.html">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</li>

</ul>

</aside>

<!-- Main Content -->

<main class="main">

<header class="topbar">

<h2>Settings</h2>

</header>

<!-- Institute Information -->

<div class="box">

<h3>Institute Information</h3>

<form>

<label>Institute Name</label>

<input
type="text"
value="Balaji Coaching Center">

<label>Owner Name</label>

<input
type="text"
value="Admin">

<label>Email</label>

<input
type="email"
value="balajicoaching@gmail.com">

<label>Phone</label>

<input
type="text"
value="+91 9876543210">

<label>Address</label>

<textarea>

Lucknow, Uttar Pradesh

</textarea>

<button>

Save Changes

</button>

</form>

</div>

<!-- Admin Profile -->

<div class="box">

<h3>Admin Profile</h3>

<div class="student-profile">

<img
src="https://i.pravatar.cc/120?img=15">

<div>

<h2>Administrator</h2>

<p>Role : Super Admin</p>

<p>Last Login : Today 09:30 AM</p>

<p>Status : Active</p>

</div>

</div>

</div>

<!-- Change Password -->

<div class="box">

<h3>Change Password</h3>

<form>

<input
type="password"
placeholder="Current Password">

<input
type="password"
placeholder="New Password">

<input
type="password"
placeholder="Confirm Password">

<button>

Update Password

</button>

</form>

</div>

<!-- Notification -->

<div class="box">

<h3>Notifications</h3>

<label>

<input type="checkbox" checked>

Email Notifications

</label>

<br><br>

<label>

<input type="checkbox" checked>

SMS Notifications

</label>

<br><br>

<label>

<input type="checkbox">

Parent Notifications

</label>

</div>

<!-- Theme -->

<div class="box">

<h3>Appearance</h3>

<select>

<option>Light Theme</option>

<option>Dark Theme</option>

<option>System Default</option>

</select>

</div>

<!-- Backup -->

<div class="box">

<h3>Backup & Restore</h3>

<button>

<i class="fa-solid fa-download"></i>

Download Backup

</button>

<button>

<i class="fa-solid fa-upload"></i>

Restore Backup

</button>

</div>

<!-- Logout -->

<div class="box">

<h3>Account</h3>

<button class="logout-btn">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>

</div>

</main>

</div>

<script src="app.js"></script>

</body>

</html>
